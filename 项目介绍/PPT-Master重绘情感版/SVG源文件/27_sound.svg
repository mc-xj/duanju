<text x="56" y="318" font-family="SimSun, Cambria" font-size="32" fill="#F2EBDD">雨声与雷声</text><text x="56" y="389" font-size="26" fill="#B5C1C3"><tspan x="56" dy="0">先建立宿舍现实，</tspan><tspan x="56" dy="40">再被白光抽空。</tspan></text>
